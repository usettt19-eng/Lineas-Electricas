# ======================================================================================
#  Endurecimiento de seguridad para energia.useservices.company (sitio estático + /admin)
#
#  Uso (en el servidor, como root):
#     cp /var/www/energia/deploy/nginx-energia-seguridad.conf /etc/nginx/snippets/energia-seguridad.conf
#     # dentro del bloque  server { ... }  del sitio (/etc/nginx/sites-enabled/energia), agrega:
#     #     include snippets/energia-seguridad.conf;
#     nginx -t && systemctl reload nginx
#
#  IMPORTANTE: si algún bloque "location" del sitio define sus propios add_header, Nginx NO hereda
#  los del servidor: repite allí este include.
# ======================================================================================

# --- Cabeceras de seguridad -------------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=15552000" always;

# Política de contenido: solo se ejecutan scripts de este mismo sitio (nada en línea ni de terceros).
# Las conexiones salen únicamente a tu proyecto de Supabase.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://atsvcwvfapfzabrywjwx.supabase.co; connect-src 'self' https://atsvcwvfapfzabrywjwx.supabase.co; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

# --- Este sitio es estático: no acepta subidas ni métodos de escritura -------------------
client_max_body_size 1k;
if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
autoindex off;

# --- Archivos que nunca deben servirse ----------------------------------------------------
location ~ /\.(?!well-known) { return 404; }                       # .git, .env, etc.
location ^~ /deploy/ { return 404; }                              # esta carpeta de configuración
location ~* \.(md|sh|py|conf|example|log|bak|old|sql|env|ya?ml|json5?)$ { return 404; }

# --- Limitar la frecuencia de solicitudes por IP -------------------------------------------
# Requiere definir antes, en /etc/nginx/conf.d/energia-limite.conf (contexto http):
#     limit_req_zone $binary_remote_addr zone=energia:10m rate=20r/s;
# y descomentar la línea siguiente:
# limit_req zone=energia burst=60 nodelay;
