<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel de Gestión</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

<section id="login" hidden>
  <form class="login-card" id="loginForm">
    <h1>Panel de Gestión</h1>
    <p>Acceso solo para personal autorizado.</p>
    <div class="field"><label for="email">Correo</label><input id="email" type="email" autocomplete="username" required /></div>
    <div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required /></div>
    <button class="btn" type="submit" style="width:100%">Entrar</button>
    <div class="msg-err" id="loginErr" hidden></div>
  </form>
</section>

<section id="app" hidden>
  <header class="top">
    <h1>Panel de Gestión</h1>
    <nav class="nav" id="nav"></nav>
    <div><span class="who" id="who"></span><button class="btn ghost small" id="reload" type="button">Actualizar</button> <button class="btn ghost small" id="logout" type="button">Salir</button></div>
  </header>
  <main id="main"></main>
</section>

<div class="overlay" id="drawer" hidden><div class="panel" id="panel"></div></div>
<div class="overlay center" id="modal" hidden><div class="dialog" id="dialog"></div></div>
<div class="overlay center" id="modal2" hidden><div class="dialog" id="dialog2"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="core.js"></script>
<script src="empresa.js"></script>
<script src="directorios.js"></script>
<script src="solicitudes.js"></script>
<script src="finanzas.js"></script>
<script src="main.js"></script>
</body>
</html>
